# Render Blueprint: the ASP.NET Core API and the Python agent service, both on the free plan.
# Apply it from the Render dashboard (New → Blueprint → this repository). Step by step: docs/DEPLOYMENT.md.
#
# Secrets are never in this file. Each one is either
#   - generated by Render (generateValue) and shared through fromService, so nobody types or sees it, or
#   - marked sync: false, so Render asks for the value in the dashboard when the Blueprint is applied.
# PostgreSQL is not here: it runs on Neon, and its connection string is one of the sync: false values.

services:
  # ── ASP.NET Core API ─────────────────────────────────────────────────────
  - type: web
    name: agriguard-api
    runtime: docker
    plan: free
    # Singapore: the closest Render region to Sri Lanka, next to the Neon database (AWS Singapore).
    region: singapore
    branch: main
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    # Liveness only: a slow or sleeping database must not make Render restart the API.
    # /health (with the database check) is the one to open by hand and submit.
    healthCheckPath: /health/live
    envVars:
      # ── Secrets ──
      - key: ConnectionStrings__Default
        sync: false
      # Base64 of 256 random bits, which is exactly what Jwt:SigningKey needs (>= 32 bytes).
      - key: Jwt__SigningKey
        generateValue: true
      # Shared with the agent (AGENT_API_KEY reads this value below); 44 characters >= the 32 required.
      - key: AgentService__ApiKey
        generateValue: true
      - key: Payments__Stripe__SecretKey
        sync: false
      - key: Payments__Stripe__WebhookSecret
        sync: false
      # ── Public URLs, known only after the first deploy (docs/DEPLOYMENT.md says when to fill them) ──
      - key: AgentService__BaseUrl
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: Payments__PublicBaseUrl
        sync: false
      # ── Plain settings ──
      # Render terminates TLS; trust its X-Forwarded-Proto/-For (the last hop only).
      - key: ForwardedHeaders__Enabled
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: Calendar__TimeZone
        value: Asia/Colombo
      # Seeding runs only during `dotnet ef database update`, never on API start; kept for clarity.
      - key: Seed__DemoUsers
        value: "true"
      # A sleeping free agent service takes about a minute to wake; 10 s (the local default) would
      # fail the first run of the day. Warm both services before a demo anyway.
      - key: AgentService__DispatchTimeout
        value: "00:01:30"

  # ── Python agent service ─────────────────────────────────────────────────
  - type: web
    name: agriguard-agent
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    dockerContext: ./agent
    dockerfilePath: ./agent/Dockerfile
    # /health/live calls nothing; /health would spend a model-provider request on every probe.
    healthCheckPath: /health/live
    envVars:
      - key: AGENT_API_KEY
        fromService:
          type: web
          name: agriguard-api
          envVarKey: AgentService__ApiKey
      - key: AGENT_LLM_API_KEY
        sync: false
      - key: AGENT_API_BASE_URL
        sync: false
      - key: AGENT_LLM_PROVIDER
        value: openai-compatible
      # Groq's OpenAI-compatible endpoint. For Gemini instead, see docs/DEPLOYMENT.md.
      - key: AGENT_LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # Not a reasoning model, so max_tokens is not spent on hidden reasoning before the JSON.
      - key: AGENT_LLM_MODEL
        value: llama-3.3-70b-versatile
