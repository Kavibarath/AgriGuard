# Keeps action pins and package versions current with one grouped PR per ecosystem per week
# instead of a flood.
#
# Majors are ignored until after the SE3090 submission (30 Sept 2026): swapping a compiler
# (typescript 7) or a test runner (xunit.runner.visualstudio 4, which targets xunit v3 while the
# test projects are on 2.9) mid-assignment costs more than it returns. Delete the `ignore:` blocks
# afterwards to let majors through again. Written out per ecosystem rather than with YAML anchors,
# which Dependabot's config schema does not accept.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: nuget
    directories:
      - /backend/src/*
      - /backend/tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      pub:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
