# Keeps action pins and package versions current with one grouped PR per ecosystem per week
# instead of a flood. Majors are included in the group: with CI green on the PR they are safe
# to review together, and a separate PR per package proved noisy on day one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directories:
      - /backend/src/*
      - /backend/tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      pub:
        patterns: ["*"]
