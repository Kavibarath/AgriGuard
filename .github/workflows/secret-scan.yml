# Secret scanning (§13: no secrets in the repo). Runs on every branch so a leaked key is caught
# on the feature branch, before it reaches main and becomes part of the submitted history.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history — secrets hide in old commits)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal repositories; an organisation repo would need GITLEAKS_LICENSE.
