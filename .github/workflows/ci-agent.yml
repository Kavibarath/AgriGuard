# Agent service CI (§13): lint, type-check and test the LangGraph workflow.
# No model is needed — the tests stub the LLM and the tools, so CI stays fast and deterministic.
name: ci-agent

# No `paths:` filter — see the note in ci-backend.yml: required checks must always report.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.0.0
        with:
          # Pinned to the version the developers run; LangGraph lags the newest release.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check (strict)
        run: mypy app

      - name: Test
        run: pytest -q
